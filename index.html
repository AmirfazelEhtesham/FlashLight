<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>چراغ قوه</title>
<link href="https://fonts.googleapis.com/css?family=Lalezar&amp;subset=arabic" rel="stylesheet">
<style>
html,body{margin:0;padding:0;height:100%}
body{
  background:#1a1a2e;
  font-family:'Lalezar',Tahoma,Arial,sans-serif;
  color:#fff;
  display:-webkit-box;display:-ms-flexbox;display:-webkit-flex;display:flex;
  -webkit-align-items:center;align-items:center;
  -webkit-justify-content:center;justify-content:center;
}
.card{
  width:90%;max-width:360px;
  background:#16213e;
  border:2px solid #0f3460;
  -webkit-border-radius:24px;border-radius:24px;
  padding:26px 18px;
  text-align:center;
  -webkit-box-sizing:border-box;box-sizing:border-box;
}
h1{margin:0;font-size:36px;font-weight:normal;color:#ffd60a}
#st{margin:8px 0 22px;min-height:24px;font-size:18px;color:#a8b2d1}
button{
  font-family:inherit;color:#fff;border:0;cursor:pointer;
  font-size:20px;
  -webkit-border-radius:30px;border-radius:30px;
  -webkit-tap-highlight-color:transparent;
}
button:active{opacity:.8}
#on{
  width:170px;height:170px;
  font-size:30px;color:#3b2f00;
  background:#ffd60a;
  -webkit-border-radius:50%;border-radius:50%;
  border:6px solid #fff3a3;
  -webkit-box-shadow:0 0 30px 6px rgba(255,214,10,.5);
  box-shadow:0 0 30px 6px rgba(255,214,10,.5);
}
body.lit #on{
  -webkit-box-shadow:0 0 60px 20px rgba(255,214,10,.9);
  box-shadow:0 0 60px 20px rgba(255,214,10,.9);
}
.modes{margin:26px 0 14px;font-size:0}
.modes button{
  width:31%;margin:0 1%;height:46px;font-size:18px;
  background:transparent;border:2px solid #4f6bb5;color:#cfd8ff;
}
.modes button.act{background:#4f6bb5;color:#fff}
#off{width:100%;height:48px;background:#e63946}
.foot{margin-top:18px;font-size:15px;color:#8892b0}
.foot a{color:#ffd60a;text-decoration:none;border-bottom:1px dotted #ffd60a}
#scr{
  position:fixed;top:0;right:0;bottom:0;left:0;
  z-index:9;display:none;background:#fff;cursor:pointer;
}
#scr span{
  position:absolute;bottom:20px;left:0;right:0;
  text-align:center;color:#64748b;font-size:18px;
}
</style>
</head>
<body>
<div class="card">
  <h1>چراغ قوه</h1>
  <div id="st">آماده</div>
  <button id="on">روشن</button>
  <div class="modes">
    <button data-m="strobe">چشمک‌زن</button><button data-m="sos">SOS</button><button data-m="screen">نور صفحه</button>
  </div>
  <button id="off">خاموش کردن</button>
  <div class="foot">&copy; <a href="https://amirfazelehtesham.github.io" target="_blank" rel="noopener">AmirFazel Ehtesham</a></div>
</div>
<div id="scr"><span>برای خاموش کردن لمس کنید</span></div>

<script>
var st=document.getElementById('st'),
    scr=document.getElementById('scr'),
    onBtn=document.getElementById('on'),
    offBtn=document.getElementById('off'),
    modeBtns=document.querySelectorAll('[data-m]'),
    stream=null,track=null,torchOk=false,timer=null,wake=null,U=200;

function say(t){st.textContent=t}
function mark(m){
  for(var i=0;i<modeBtns.length;i++){
    var b=modeBtns[i];
    if(b.getAttribute('data-m')===m){b.className='act'}else{b.className=''}
  }
}
function getCam(){
  var md=navigator.mediaDevices;
  if(md&&md.getUserMedia){
    return md.getUserMedia({video:{facingMode:{ideal:'environment'}}});
  }
  var old=navigator.getUserMedia||navigator.webkitGetUserMedia||navigator.mozGetUserMedia;
  if(old){
    return new Promise(function(ok,no){old.call(navigator,{video:true},ok,no)});
  }
  return Promise.reject(new Error('no camera'));
}
function release(){
  if(stream){
    var t=stream.getTracks?stream.getTracks():[];
    for(var i=0;i<t.length;i++){t[i].stop()}
  }
  stream=null;track=null;
}
function ensureCamera(){
  if(stream){return Promise.resolve()}
  return getCam().then(function(s){
    stream=s;
    track=s.getVideoTracks()[0];
    var cap=track&&track.getCapabilities?track.getCapabilities():null;
    torchOk=!!(cap&&cap.torch);
    if(!torchOk){release();say('فلاش پشتیبانی نمی‌شود، نور صفحه روشن شد')}
  }).catch(function(){
    stream=null;track=null;torchOk=false;
    say('دسترسی به فلاش ممکن نیست، نور صفحه روشن شد');
  });
}
function out(on){
  if(torchOk&&track){
    var p=track.applyConstraints({advanced:[{torch:on}]});
    if(p&&p.catch){p.catch(function(){})}
  }
  scr.style.display=on?'block':'none';
}
function run(steps){
  var i=0;
  (function tick(){
    var s=steps[i%steps.length];
    i++;
    out(s[0]);
    timer=setTimeout(tick,s[1]);
  })();
}
function sosSteps(){
  var s=[],d=[1,1,1,3,3,3,1,1,1];
  for(var i=0;i<d.length;i++){
    s.push([1,d[i]*U]);s.push([0,U]);
    if(i%3===2){s.push([0,2*U])}
  }
  s.push([0,4*U]);
  return s;
}
function begin(m){
  clearTimeout(timer);
  mark(m);
  document.body.className='lit';
  var ready=(m==='screen')?Promise.resolve():ensureCamera();
  ready.then(function(){
    if(navigator.wakeLock&&navigator.wakeLock.request){
      navigator.wakeLock.request('screen').then(function(w){wake=w}).catch(function(){});
    }
    var de=document.documentElement,
        fs=de.requestFullscreen||de.webkitRequestFullscreen||de.mozRequestFullScreen;
    if(fs){try{var r=fs.call(de);if(r&&r.catch){r.catch(function(){})}}catch(e){}}
    if(m==='strobe'){say('چشمک‌زن فعال است');run([[1,90],[0,90]])}
    else if(m==='sos'){say('SOS فعال است');run(sosSteps())}
    else if(m==='screen'){say('نور صفحه فعال است');out(true)}
    else{if(torchOk){say('نور با حداکثر توان روشن شد')}else if(!stream){}out(true)}
  });
}
function stop(){
  clearTimeout(timer);
  out(false);
  release();torchOk=false;mark('');
  document.body.className='';
  if(wake&&wake.release){wake.release();wake=null}
  var ex=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen;
  if(ex&&(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement)){
    try{ex.call(document)}catch(e){}
  }
  say('چراغ خاموش شد');
}

onBtn.onclick=function(){begin('steady')};
offBtn.onclick=stop;
scr.onclick=stop;
for(var i=0;i<modeBtns.length;i++){
  (function(b){b.onclick=function(){begin(b.getAttribute('data-m'))}})(modeBtns[i]);
}
document.addEventListener('visibilitychange',function(){if(document.hidden){stop()}});
</script>
</body>
 </html>
